name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (fissioninterface)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fissioninterface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fissioninterface/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Create React App fails the build on lint warnings when CI=true.
          # The app currently has ~65 unused-variable/hook warnings; keep them
          # visible in the log without failing. Remove once they are cleaned up.
          CI: false
      - uses: actions/upload-artifact@v4
        with:
          name: fissioninterface-build
          path: fissioninterface/build
          if-no-files-found: error

  firmware:
    name: Firmware (FireBeetle 2 ESP32-E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e dfrobot_firebeetle2_esp32e
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-dfrobot_firebeetle2_esp32e
          path: |
            .pio/build/dfrobot_firebeetle2_esp32e/firmware.bin
            .pio/build/dfrobot_firebeetle2_esp32e/firmware.elf
          if-no-files-found: error
